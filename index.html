<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf7ef">
<meta name="robots" content="noindex, nofollow">
<title>Pour Abdou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Caveat:wght@500;700&family=Patrick+Hand&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Un cuaderno hecho a mano: papel, tinta azul marino y acuarela.
   Cada capítulo tiñe el fondo de un color y dibuja sus propios garabatos. */
@property --ck{syntax:'<color>';inherits:true;initial-value:#9dbbe3}
@property --ck2{syntax:'<color>';inherits:true;initial-value:#7aa0d6}
@property --bgc{syntax:'<color>';inherits:true;initial-value:#faf3e4}
:root{
  --paper:#fffcf5;
  --ink:#2b3350;
  --ink-soft:#6b7290;
  --blue:#9db8e0;
  --blue-deep:#5f84c2;
  --yellow:#f2c35b;
  --rose:#eb9ab2;
  --red:#d64550;
  --sage:#8dbd9b;
  --tape:rgba(255,255,255,.6);
  --shadow:rgba(43,51,80,.14);
  --f-display:"Caveat Brush","Caveat","Segoe Print","Bradley Hand",cursive;
  --f-script:"Caveat","Segoe Print","Bradley Hand",cursive;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-hand:"Patrick Hand","Segoe Print","Bradley Hand","Comic Sans MS",cursive;
  --r-hand:255px 18px 225px 18px/18px 225px 18px 255px;
  --r-hand-2:18px 225px 18px 255px/255px 18px 225px 18px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{
  --txt:var(--ink);--txt-soft:var(--ink-soft);
  background:var(--bgc);color:var(--ink);font-family:var(--f-hand);font-size:19px;line-height:1.4;
  -webkit-tap-highlight-color:transparent;
  transition:--ck 1.2s ease,--ck2 1.2s ease,--bgc 1.2s ease;
}
/* temas de cada capítulo: los cuadros cambian de color */
body[data-ch="lock"]{--bgc:#161b2e;--ck:#161b2e;--ck2:#161b2e;--txt:#f7eedb;--txt-soft:#8e95b3}
body[data-ch="lock"] :is(#bg,#shapes){opacity:0}
body[data-ch="photo"]{--ck:#9dbbe3;--ck2:#7aa0d6}
body[data-ch="questions"]{--ck:#b9cdea;--ck2:#93b0dc}
body[data-ch="game"]{--ck:#8fb3dc;--ck2:#6c94cb}
body[data-ch="gift"]{--ck:#f1b5c8;--ck2:#e094ad}
body[data-ch="cake"]{--ck:#f5c89c;--ck2:#e5aa74}
body[data-ch="letter"]{--ck:#f3cf82;--ck2:#e2b257}
body[data-ch="hug"]{--ck:#f1b5c8;--ck2:#e094ad}
body.night{--bgc:#1d2338;--ck:#34406a;--ck2:#46558a;--txt:#f7eedb;--txt-soft:#d3d0e0}

/* fondo: cuadros de acuarela + figuras que crecen y respiran */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;transition:opacity 1.2s}
body.night #bg rect{filter:url(#paintSoft)}
#shapes{position:fixed;inset:0;z-index:0;pointer-events:none;transition:opacity 1.2s}
.shp{position:absolute;display:block;animation:stick .7s cubic-bezier(.2,1.6,.4,1) both;transition:opacity .5s,transform .5s}
.shp.bye{opacity:0;transform:scale(.2) rotate(40deg)!important;animation:none}
.shp .grow{display:block;animation:grow var(--gd,7s) ease-in-out var(--gdl,0s) infinite alternate}
.shp svg{display:block;width:100%;height:auto;overflow:visible;animation:boil .8s steps(1) infinite}
@keyframes grow{from{transform:scale(.65) rotate(-10deg)}to{transform:scale(1.35) rotate(12deg)}}
@keyframes boil{0%{transform:rotate(0)}33%{transform:rotate(1.2deg) translate(.4px,-.4px)}66%{transform:rotate(-.8deg) translate(-.4px,.4px)}}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.app{position:relative;z-index:1;overflow-x:hidden;overflow-x:clip;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:18px 16px 110px;padding-top:max(18px,env(safe-area-inset-top))}
.page{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px;align-items:stretch}
.page.in{animation:place .8s cubic-bezier(.2,1.1,.3,1) backwards}
@keyframes place{from{opacity:0;transform:translateY(-24px) rotate(-2deg) scale(.98)}to{opacity:1;transform:none}}

/* avanzar tocando la pantalla */
.tapnext{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom, 0px));z-index:50;appearance:none;cursor:pointer;display:block;white-space:nowrap;border:0;background:none;padding:10px 16px;color:var(--txt-soft);font:700 1.5rem/1 var(--f-script);text-shadow:0 1px 0 var(--bgc),0 -1px 0 var(--bgc),1px 0 0 var(--bgc),-1px 0 0 var(--bgc),0 0 8px var(--bgc);animation:tapin .8s ease both,breathe 2.4s ease-in-out .8s infinite;touch-action:manipulation}
.tapnext svg{display:none}
@keyframes tapin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* tipografía */
.say{margin:0;font:400 2.3rem/1.05 var(--f-display);color:var(--txt);text-align:center;text-wrap:balance;transition:color .8s;text-shadow:0 2px 0 var(--bgc),0 -2px 0 var(--bgc),2px 0 0 var(--bgc),-2px 0 0 var(--bgc)}
.say.small{font-size:1.75rem}
.sub,.tap,.foot{text-shadow:0 1px 0 var(--bgc),0 -1px 0 var(--bgc),1px 0 0 var(--bgc),-1px 0 0 var(--bgc)}
.sub{margin:0;text-align:center;font-size:1.15rem;color:var(--txt-soft);transition:color .8s}
.c{opacity:0;transition:opacity .35s}
.c.on{opacity:1}
.ih{display:inline-block;width:.8em;height:.8em;vertical-align:-.05em;margin:0 .08em}
.ih path{fill:var(--red);stroke:var(--ink);stroke-width:2.5}

/* nota de papel */
.note{position:relative;background:var(--paper);border:2px solid var(--ink);border-radius:var(--r-hand);padding:26px 20px 22px;box-shadow:5px 6px 0 var(--shadow);transform:rotate(-1deg)}
.note.r{transform:rotate(1deg);border-radius:var(--r-hand-2)}
.note::before{content:"";position:absolute;left:50%;top:-14px;width:96px;height:26px;margin-left:-48px;background:var(--tape);border:1px solid rgba(43,51,80,.12);transform:rotate(-3deg)}
.note.no-tape::before{display:none}
.note h3{margin:0 0 8px;font:400 1.75rem/1.1 var(--f-display)}
.note p{margin:0}
.to{font:700 1.6rem/1 var(--f-script);color:var(--blue-deep);margin:0 0 6px!important}

/* botones */
.btn{appearance:none;cursor:pointer;font:400 1.45rem/1 var(--f-display);color:var(--ink);background:var(--yellow);border:2px solid var(--ink);border-radius:var(--r-hand);padding:0 26px;min-height:54px;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:3px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s;touch-action:manipulation}
.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.blue{background:var(--blue)}
.btn.rose{background:var(--rose)}
.btn.wide{width:100%}
.link{appearance:none;background:none;border:0;cursor:pointer;font:400 1.2rem/1 var(--f-hand);color:var(--blue-deep);text-decoration:underline wavy;text-decoration-thickness:1px;text-underline-offset:5px;padding:10px}
.link.quiet{color:var(--txt-soft);font-size:1.05rem}
.next{align-self:center}
.flower-hit:focus:not(:focus-visible){outline:none}
:is(.btn,.link,.field,.polaroid,.gift,.skill,.cls,.flower-hit,.flame-hit):focus-visible{outline:3px dashed var(--blue-deep);outline-offset:4px}

/* campos */
.field{width:100%;background:transparent;border:0;border-bottom:2px dashed var(--ink);color:var(--ink);font:400 1.5rem/1.2 var(--f-hand);padding:10px 4px;min-height:52px;border-radius:0}
.field::placeholder{color:#a3a9bd}
.field:focus{outline:none;border-bottom-style:solid;border-color:var(--blue-deep)}
.feedback{margin:0;min-height:1.4em;color:var(--red);font-size:1.05rem}
.feedback.good{color:#3f8a5a}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px) rotate(-1deg)}40%,80%{transform:translateX(8px) rotate(1deg)}}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row .btn{flex:1}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:14px}

/* consola de entrada */
#p-lock{padding-top:5vh;gap:26px}
.termwrap{position:relative}
.term{position:relative;background:#1f2640;border:1px solid #0e1221;border-radius:12px;box-shadow:0 24px 60px -24px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.04);overflow:hidden;font:400 .9rem/1.6 var(--f-mono);color:#e9e3d3}
.term-bar{display:flex;align-items:center;gap:7px;padding:10px 12px;background:#171d33;border-bottom:1px solid rgba(255,255,255,.06);color:#7d84a3;font-size:.75rem}
.term-bar i{width:11px;height:11px;border-radius:50%}
.term-bar i:nth-child(1){background:#d64550}.term-bar i:nth-child(2){background:#f2c35b}.term-bar i:nth-child(3){background:#8dbd9b}
.term-bar span{flex:1;text-align:center;margin-right:40px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.term-body{padding:14px 14px 16px;min-height:290px;background-image:repeating-linear-gradient(to bottom,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
.tl{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.tl.cmd{color:#f7eedb}.tl.muted{color:#8e95b3}.tl.ok{color:#8dbd9b}.tl.err{color:#ec8fae}.tl.warn{color:#f2c35b}.tl.echo{color:#f7eedb}
.tl.cur::after{content:"";display:inline-block;width:.55em;height:1.05em;margin-left:2px;vertical-align:-.15em;background:#f2c35b;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.term-form{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.term-q{margin:0;color:#f2c35b}
.term-line{display:flex;align-items:center;gap:8px;border:1px dashed rgba(247,238,219,.28);border-radius:8px;padding:4px 4px 4px 10px}
.term-line:focus-within{border-style:solid;border-color:#f2c35b}
.term-line .ps{color:#8dbd9b;font-weight:700}
.term-in{flex:1;min-width:0;letter-spacing:-.02em;background:transparent;border:0;outline:0;color:#f7eedb;font:400 16px/1.4 var(--f-mono);caret-color:#f2c35b;padding:8px 0}
.term-in::placeholder{color:#5d6485}
.term-go{appearance:none;cursor:pointer;border:0;background:#f2c35b;color:#1f2640;font:700 1.05rem/1 var(--f-mono);border-radius:6px;padding:9px 12px;touch-action:manipulation;white-space:nowrap}
.term-go:active{transform:translateY(1px)}
.term .hearts{color:#8e95b3;font-size:.8rem}
.term-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.term-hint{appearance:none;cursor:pointer;background:none;border:1px dashed #8e95b3;color:#c9c6d8;font:400 .8rem/1 var(--f-mono);border-radius:6px;padding:9px 10px;touch-action:manipulation}
.term-hint:active{transform:translateY(1px)}
.term .hearts svg{width:22px;height:20px}
.term .hearts path{stroke:#d64550}
.tag{position:absolute;right:-6px;top:-20px;z-index:2;background:#fbeeb0;padding:6px 14px 4px;font:700 1.45rem/1 var(--f-script);color:var(--ink);transform:rotate(5deg);box-shadow:2px 3px 0 rgba(0,0,0,.25)}
.tag::before{content:"";position:absolute;left:50%;top:-9px;width:50px;height:16px;margin-left:-25px;background:var(--tape);transform:rotate(-4deg)}
.term.out{animation:termout .9s ease-in forwards}
@keyframes termout{35%{filter:brightness(1.5)}100%{transform:scale(1.06);opacity:0;filter:blur(6px) brightness(2.2)}}
body[data-ch="lock"] .postit{box-shadow:2px 3px 0 rgba(0,0,0,.3)}

/* post-its */
.postits{display:flex;flex-direction:column;gap:10px}
.postit{background:#fbeeb0;padding:10px 14px;font:500 1.3rem/1.25 var(--f-script);color:var(--ink);box-shadow:2px 3px 0 var(--shadow);transform:rotate(-1.5deg);animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
.postit:nth-child(2n){transform:rotate(1.2deg);background:#f9dbe4}
.postit:nth-child(3n){transform:rotate(-.6deg);background:#dce8f6}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-10deg)}to{opacity:1}}

/* corazones (intentos) */
.hearts{display:flex;gap:8px;align-items:center;font-size:.95rem;color:var(--ink-soft)}
.hearts svg{width:28px;height:26px;overflow:visible}
.hearts .h1,.hearts .h2{transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .5s}
.hearts .broken .h1{transform:translate(-4px,4px) rotate(-18deg);opacity:.35}
.hearts .broken .h2{transform:translate(4px,5px) rotate(18deg);opacity:.35}
.lockbox{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;margin-top:10px}
.lockbox strong{font:400 3rem/1 var(--f-display);font-variant-numeric:tabular-nums}

/* garabatos-pegatina (tinta + color plano) */
.stk{position:absolute;display:block;pointer-events:none;animation:stick .6s cubic-bezier(.2,1.6,.4,1) both}
.stk svg{display:block;width:100%;height:auto;overflow:visible;animation:boil .8s steps(1) infinite}
@keyframes stick{from{opacity:0;transform:scale(.2) rotate(-40deg)}to{opacity:1;transform:rotate(var(--rot,0deg))}}

/* polaroid */
.polwrap{position:relative;margin:44px auto 6px;width:min(290px,76vw)}
.polaroid{position:relative;display:block;width:100%;appearance:none;cursor:pointer;background:#fff;border:0;padding:12px 12px 58px;box-shadow:0 14px 30px -12px rgba(43,51,80,.5),0 0 0 1px rgba(43,51,80,.08);transform:rotate(-3deg);transition:transform .4s cubic-bezier(.2,1.2,.4,1)}
.polaroid:active{transform:rotate(-2deg) scale(.98)}
.polaroid::before{content:"";position:absolute;left:50%;top:-12px;width:90px;height:26px;margin-left:-45px;background:var(--tape);border:1px solid rgba(43,51,80,.12);transform:rotate(4deg);z-index:2}
.polaroid .ph{position:relative;display:block;aspect-ratio:4/5;background:var(--blue);overflow:hidden}
.polaroid .ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;font:400 1.4rem/1.1 var(--f-display);text-align:center;padding:12px}
.polaroid .cap{position:absolute;left:0;right:0;bottom:14px;text-align:center;font:700 1.65rem/1 var(--f-script);color:var(--ink)}
.hat{position:absolute;z-index:3;pointer-events:none;opacity:0}
.hat.on{opacity:1;animation:hatfall 1.1s cubic-bezier(.3,1.35,.5,1) both}
@keyframes hatfall{0%{transform:translateY(-300px) rotate(-70deg)}70%{transform:translateY(8px) rotate(calc(var(--rot) + 6deg))}100%{transform:translateY(0) rotate(var(--rot))}}
.hat svg{display:block;width:100%;height:auto;overflow:visible;animation:boil .8s steps(1) infinite}
.tap{text-align:center;color:var(--txt-soft);font-size:1.1rem;margin:0;animation:breathe 2s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}

/* preguntas */
.qn{font:400 .95rem/1 var(--f-hand);color:var(--ink-soft);margin-bottom:6px}
.question{font:400 1.75rem/1.15 var(--f-display);margin:0 0 6px;text-wrap:pretty}

/* combate */
.classes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cls{appearance:none;cursor:pointer;text-align:left;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:var(--r-hand);padding:14px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:3px 4px 0 var(--shadow);font:inherit;min-width:0}
.cls:nth-child(2n){border-radius:var(--r-hand-2);transform:rotate(1deg)}
.cls:nth-child(2n+1){transform:rotate(-1deg)}
.cls:active{transform:scale(.97)}
.cls .ci{width:44px;height:44px;border-radius:50% 46% 52% 48%;display:grid;place-items:center;color:var(--ink);border:2px solid var(--ink)}
.cls .ci svg,.skill .si svg{width:24px;height:24px}
.cls b{font:400 1.45rem/1 var(--f-display)}
.cls small{font-size:.95rem;line-height:1.25;color:var(--ink-soft)}
.cls em{font-style:normal;font-size:.8rem;line-height:1.3;color:var(--blue-deep)}
.ico{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hbar{display:grid;grid-template-columns:4.6em 1fr auto;gap:10px;align-items:center;font-size:1rem}
.hbar .tr{height:14px;border:2px solid var(--ink);border-radius:var(--r-hand);background:var(--paper);overflow:hidden}
.hbar .tr i{display:block;height:100%;width:100%;transition:width .3s}
.hbar.boss .tr i{background:repeating-linear-gradient(-45deg,var(--sage) 0 6px,#79ab88 6px 12px)}
.hbar.me .tr i{background:repeating-linear-gradient(-45deg,var(--rose) 0 6px,#e0809c 6px 12px)}
.hbar.mp .tr i{background:repeating-linear-gradient(-45deg,var(--blue) 0 6px,#89a8d6 6px 12px)}
.hbar .num{min-width:4ch;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.cast{display:grid;gap:4px}
.cast .lbl{display:flex;justify-content:space-between;gap:8px;color:var(--red);font-size:1rem}
.cast .tr{height:10px;border:2px solid var(--red);border-radius:var(--r-hand);overflow:hidden;background:var(--paper)}
.cast .tr i{display:block;height:100%;width:0;background:var(--red)}
.stage{position:relative;height:210px;border:2px solid var(--ink);border-radius:var(--r-hand-2);overflow:hidden;background:linear-gradient(180deg,#eef3fa,#d3e1f3 60%,#bcd0ec);transition:background .8s}
.stage svg.sea{position:absolute;left:0;right:0;bottom:0;width:100%;height:60px}
.serpent{position:absolute;left:50%;bottom:14px;width:240px;margin-left:-120px}
.serpent svg{display:block;width:100%;height:auto}
.serpent .head{transform-box:fill-box;transform-origin:50% 100%;animation:headbob 2.2s ease-in-out infinite}
.serpent .head.r{animation-delay:-1.1s}
@keyframes headbob{50%{transform:translateY(6px) rotate(-4deg)}}
.serpent .eye{fill:var(--paper);transition:fill .3s}
.stage.casting .serpent .eye{fill:var(--red)}
.stage.casting{animation:castpulse 1s ease-in-out infinite}
@keyframes castpulse{50%{box-shadow:inset 0 0 36px rgba(214,69,80,.3)}}
.stage.enraged{background:linear-gradient(180deg,#f8eaee,#efd0db 60%,#e3b4c5)}
.serpent.hit svg{animation:hitflash .3s}
.serpent.dead{animation:sinkk 1.4s ease-in forwards}
.serpent.stunned .head{animation-play-state:paused}
@keyframes hitflash{30%{filter:brightness(1.3);transform:translateX(-6px)}60%{transform:translateX(6px)}}
@keyframes sinkk{to{transform:translateY(170px);opacity:0}}
.dmg{position:absolute;font:400 1.5rem/1 var(--f-display);pointer-events:none;animation:rise 1s ease-out forwards;white-space:nowrap;z-index:2;text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff}
.dmg.hurt{color:var(--red)}
.dmg.heal{color:#3f8a5a}
.dmg.hit{color:var(--ink)}
.dmg.info{color:var(--blue-deep);font-size:1.2rem}
@keyframes rise{to{transform:translateY(-60px);opacity:0}}
.stage.flash{animation:redflash .35s}
@keyframes redflash{40%{box-shadow:inset 0 0 0 5px var(--red)}}
.status{display:flex;flex-wrap:wrap;gap:6px;min-height:26px}
.status span{font-size:.9rem;padding:2px 10px;border:1.5px solid var(--ink);border-radius:var(--r-hand);background:var(--paper)}
.status span.warn{color:var(--red);border-color:var(--red)}
.combatlog{margin:0;min-height:1.4em;text-align:center;font-size:1.05rem;color:var(--ink-soft)}
.skills{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.skill{position:relative;overflow:hidden;appearance:none;cursor:pointer;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:14px 10px 16px 9px;min-height:90px;padding:6px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:400 .8rem/1.05 var(--f-hand);touch-action:manipulation;min-width:0;overflow-wrap:anywhere;box-shadow:2px 3px 0 var(--shadow)}
.skill .si{display:grid;place-items:center;height:26px}
.skill .mpc{font-size:.72rem;color:var(--blue-deep)}
.skill.stunner{background:#fbeeb0}
.skill::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--cd,0) * 100%);background:rgba(43,51,80,.3);pointer-events:none}
.skill:disabled{cursor:default}
.skill:active:not(:disabled){transform:scale(.94)}
.fightui{display:flex;flex-direction:column;gap:12px}
.skip{display:block;margin:6px auto 0}

/* regalo + ramo */
.gift{position:relative;width:180px;height:180px;margin:22px auto 4px;appearance:none;background:none;border:0;padding:0;cursor:pointer;animation:wiggle 2.4s ease-in-out infinite}
@keyframes wiggle{0%,78%,100%{transform:none}84%{transform:rotate(-4deg)}90%{transform:rotate(4deg)}96%{transform:rotate(-2deg)}}
.gift svg{display:block;width:100%;height:100%;overflow:visible}
.gift .lid{transition:transform .8s cubic-bezier(.3,1.3,.5,1),opacity .7s;transform-box:fill-box;transform-origin:center}
.gift .boxb{transition:transform .6s .35s,opacity .6s .35s;transform-box:fill-box;transform-origin:center bottom}
.gift.open{animation:none}
.gift.open .lid{transform:translate(60px,-130px) rotate(40deg);opacity:0}
.gift.open .boxb{transform:translateY(30px) scale(.85);opacity:0}
.garden svg{display:block;width:100%;height:auto;overflow:visible}
.garden.rise{animation:bouquet 1.1s cubic-bezier(.2,1.2,.4,1) both}
@keyframes bouquet{from{opacity:0;transform:translateY(80px) scale(.4)}to{opacity:1;transform:none}}
.petals{transform-box:fill-box;transform-origin:center;transform:scale(0) rotate(-40deg);transition:transform .9s cubic-bezier(.2,1.5,.4,1)}
.flower.open .petals{transform:scale(1) rotate(0)}
.bud{transition:opacity .3s}
.flower.open .bud{opacity:0}
.flower-hit{cursor:pointer}
.flower:not(.open) .bud{animation:budpulse 1.6s ease-in-out infinite}
@keyframes budpulse{50%{opacity:.6}}
.reason p{font:500 1.7rem/1.2 var(--f-script)}
.reason small{display:block;color:var(--ink-soft);font-size:.95rem;margin-bottom:4px}

/* tarta */
.tartbox{position:relative;touch-action:none}
.tartbox svg{display:block;width:100%;height:auto;overflow:visible;transition:filter .8s}
.tartbox.wish #tart{filter:brightness(.8)}
.fglow{transition:transform .8s;transform-box:fill-box;transform-origin:center}
.tartbox.wish .fglow{transform:scale(1.9)}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .18s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.9,1.1) rotate(3deg)}}
.candle.out .flame,.candle.out .fglow{display:none}
.smoke{opacity:0}
.candle.out .smoke{animation:smoke 1.6s ease-out forwards}
@keyframes smoke{0%{opacity:.8;transform:translateY(0)}100%{opacity:0;transform:translateY(-34px)}}
.tartbox.wind .candle:not(.out) .flame{animation:lean .5s ease-in forwards}
@keyframes lean{to{transform:skewX(-35deg) scale(.6,.8) translateX(6px);opacity:.3}}
.flame-hit{cursor:pointer}
.gust{position:absolute;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);pointer-events:none;animation:gust .7s ease-out forwards}
@keyframes gust{from{transform:translateX(-120px);opacity:0}30%{opacity:1}to{transform:translateX(280px);opacity:0}}

/* carta */
.letter{background-color:var(--paper);border:2px solid var(--ink);border-radius:var(--r-hand-2);padding:28px 22px 30px;box-shadow:5px 6px 0 var(--shadow);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(2.1rem - 1px),rgba(95,132,194,.28) calc(2.1rem - 1px),rgba(95,132,194,.28) 2.1rem);background-position:0 22px;font:500 1.6rem/2.1rem var(--f-script);cursor:pointer;position:relative;margin-top:8px}
.letter::before,.letter::after{content:"";position:absolute;top:-13px;width:80px;height:24px;background:var(--tape);border:1px solid rgba(43,51,80,.12)}
.letter::before{left:24px;transform:rotate(-6deg)}
.letter::after{right:20px;transform:rotate(5deg)}
.letter .date{text-align:right;margin:0;font-size:1.3rem;color:var(--ink-soft)}
.letter .greet{font:400 2.3rem/2.4rem var(--f-display);margin:4px 0;color:var(--blue-deep)}
.letter .body{white-space:pre-wrap;margin:0;overflow-wrap:break-word}
.letter .sign{font:400 1.9rem/2.4rem var(--f-display);text-align:right;margin:12px 0 0;color:var(--red)}

/* abrazo */
.hugwrap{position:relative;height:300px}
.hugwrap svg.fig{position:absolute;left:50%;bottom:0;width:230px;margin-left:-115px;overflow:visible}
.fig .arm{transform-box:fill-box;transition:transform .8s cubic-bezier(.3,1.4,.5,1)}
.fig .arm.l{transform-origin:0% 100%;transform:translateX(-12px) rotate(-8deg)}
.fig .arm.r{transform-origin:100% 100%;transform:translateX(12px) rotate(8deg)}
.fig.open .arm.l{transform:translateX(-30px) rotate(-26deg)}
.fig.open .arm.r{transform:translateX(30px) rotate(26deg)}
.fig.squeeze .arm.l{transform:translateX(10px) rotate(6deg)}
.fig.given .arm.l{transform:translateX(4px) rotate(2deg)}
.fig.squeeze .arm.r{transform:translateX(-10px) rotate(-6deg)}
.fig.given .arm.r{transform:translateX(-4px) rotate(-2deg)}
.fig .core{transform-box:fill-box;transform-origin:center}
.fig.squeeze .core{animation:squeeze .9s ease-in-out 2}
@keyframes squeeze{50%{transform:scale(.92,1.04)}}
.fig .wholefig{animation:idle 2.2s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-4px)}}
.bigheart{position:absolute;left:50%;top:48%;width:60px;margin-left:-30px;margin-top:-30px;opacity:0;pointer-events:none;z-index:5}
.bigheart.fly{animation:fly 1.6s cubic-bezier(.5,0,.3,1) forwards}
@keyframes fly{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-40px) scale(14)}}
.after{display:flex;flex-direction:column;gap:14px}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.count div{background:var(--paper);border:2px solid var(--ink);border-radius:var(--r-hand);padding:10px 2px 6px;display:flex;flex-direction:column;align-items:center;box-shadow:2px 3px 0 var(--shadow)}
.count div:nth-child(2n){border-radius:var(--r-hand-2);transform:rotate(1.5deg)}
.count div:nth-child(2n+1){transform:rotate(-1deg)}
.count b{font:400 2.4rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.count span{font-size:.9rem;color:var(--ink-soft)}
.foot{margin:0;text-align:center;font-size:1.05rem;color:var(--txt-soft)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
  .c{opacity:1}
}
</style>

    if (h.cura){ G.hp = Math.min(cls.vida, G.hp + h.cura); floatText('+' + h.cura, 'heal', 44, 70); log(h.n + ': ' + t('game.heal', { n: h.cura })); }
    if (h.costeVida){ const c = Math.round(cls.vida*h.costeVida); G.hp = Math.max(1, G.hp - c); floatText('-' + c, 'hurt', 44, 72); }
    if (h.dano){
      const crit = Math.random() < .18, dmg = h.dano*mult*(crit ? 1.6 : 1)*(.9 + Math.random()*.2);
      if (!h.buff && !h.cura && !h.escudo) log(h.n + (crit ? ' ' + t('game.critWord') : '') + ': ' + Math.round(dmg));
      hurtBoss(dmg, crit);
    }
    if (G.over) return;
    if (h.sangrado) G.dots.push({ tick: h.sangrado/6*mult, left: 6, acc: 0 });
    if (h.veneno) G.dots.push({ tick: h.veneno/6*mult, left: 6, acc: 0 });
    if (h.aturde){
      if (G.casting){ stopCast(); G.nextSpecial = G.t + nextSpecialIn(); floatText(t('game.interrupted'), 'info', 30, 30); log(h.n + ': ' + t('game.interrupted')); }
      G.stunUntil = G.t + 1.6; G.nextHit = Math.max(G.nextHit, G.t + 1.6);
    }
    ui();
  }
  function usePotion(){
    if (!G || G.over || G.pots <= 0 || G.potCd > G.t) return;
    G.started = true; G.pots--; G.potCd = G.t + 3; G.hp = Math.min(cls.vida, G.hp + K.curaPocion);
    floatText('+' + K.curaPocion, 'heal', 46, 70); log(t('game.potionLog', { n: K.curaPocion })); ui();
  }
  function paintSkills(){
    if (!G || !cls) return;
    const btns = $$('#skills .skill');
    cls.habilidades.forEach((h, i) => { const l = Math.max(0, G.cds[i] - G.t)/h.cd; if (btns[i]){ btns[i].style.setProperty('--cd', l.toFixed(3)); btns[i].disabled = G.over || l > 0 || G.mp < h.mp; } });
    const p = $('#potion'); if (p){ p.style.setProperty('--cd', (Math.max(0, G.potCd - G.t)/3).toFixed(3)); p.disabled = G.over || G.pots <= 0 || G.potCd > G.t; $('#potN').textContent = '×' + G.pots; }
  }
  function end(win){
    if (G.over) return;
    G.over = true; stopCast();
    if (win){
      $('#serpent').classList.add('dead'); log(t('game.sinks')); burst(...center($('#stage')), 36, 8);
      setTimeout(() => { $('#fightUI').hidden = true; $('#gameIntro').hidden = true; $('#skipGame').hidden = true; $('#winNote').hidden = false; celebrate(); reveal($('#nextGame'), 900); }, 1300);
    } else {
      log(t('game.dead')); losses++;
      setTimeout(() => { $('#skills').hidden = true; $('#loseNote').hidden = false; $('#skipGame').hidden = !canSkip(); $('#loseNote').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' }); }, 700);
    }
  }
  starts['p-game'] = () => { showPick(); leaveHooks.push(stopFight); };
  $('#retry').addEventListener('click', startFight);
  $('#changeClass').addEventListener('click', showPick);

  /* ---------- 4 · regalo + flores ---------- */
  const FLOWERS = [ {x:70,y:96,c:'#eb9ab2'}, {x:116,y:56,c:'#fffcf5'}, {x:166,y:40,c:'#9db8e0'}, {x:214,y:66,c:'#f2c35b'}, {x:244,y:118,c:'#eb9ab2'} ];
  let opened = 0;
  function buildGarden(){
    $('#gardenSvg').setAttribute('aria-label', t('gift.bouquet'));
    let h = '<g filter="url(#wobble)">';
    FLOWERS.forEach(f => { const q = `M150 214 Q ${(150+f.x)/2 + (f.x<150?-10:10)} ${(214+f.y)/2 + 20} ${f.x} ${f.y + 8}`; h += `<path d="${q}" stroke="${INK}" stroke-width="6" fill="none" stroke-linecap="round"/><path d="${q}" stroke="#8dbd9b" stroke-width="3.5" fill="none" stroke-linecap="round"/>`; });
    h += `<ellipse cx="126" cy="172" rx="16" ry="7" fill="#8dbd9b" stroke="${INK}" stroke-width="2" transform="rotate(-35 126 172)"/><ellipse cx="178" cy="180" rx="16" ry="7" fill="#8dbd9b" stroke="${INK}" stroke-width="2" transform="rotate(30 178 180)"/>`;
    FLOWERS.forEach((f, i) => {
      let petals = '';
      for (let k=0;k<6;k++) petals += `<ellipse cx="${f.x}" cy="${f.y - 13}" rx="9" ry="14" fill="${f.c}" stroke="${INK}" stroke-width="2" transform="rotate(${k*60} ${f.x} ${f.y})"/>`;
      h += `<g class="flower" data-i="${i}"><g class="petals">${petals}<circle cx="${f.x}" cy="${f.y}" r="7" fill="#f2c35b" stroke="${INK}" stroke-width="2"/></g>
        <g class="bud"><ellipse cx="${f.x}" cy="${f.y}" rx="9" ry="12" fill="${f.c}" stroke="${INK}" stroke-width="2"/><path d="M${f.x-9} ${f.y+4} Q ${f.x} ${f.y-4} ${f.x+9} ${f.y+4} L ${f.x} ${f.y+13} Z" fill="#8dbd9b" stroke="${INK}" stroke-width="2"/></g>
        <circle class="flower-hit" cx="${f.x}" cy="${f.y}" r="26" fill="transparent" tabindex="0" role="button" aria-label="${t('gift.flower', { n: i + 1 })}"/></g>`;
    });
    h += `<path d="M110 204 L190 204 L178 280 Q150 288 122 280 Z" fill="#9db8e0" fill-opacity=".8" stroke="${INK}" stroke-width="3"/><path d="M118 206 q32 16 64 0" stroke="#d64550" stroke-width="4" fill="none"/><path d="M150 212 l-12 18 M150 212 l12 18" stroke="#d64550" stroke-width="4" stroke-linecap="round"/><path d="M126 230 l6 30" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6"/></g>`;
    $('#gardenSvg').innerHTML = h;
    $$('#gardenSvg .flower').forEach(g => {
      const open = () => {
        if (g.classList.contains('open')) return;
        g.classList.add('open'); opened++;
        const i = +g.dataset.i;
        burst(...center(g.querySelector('.flower-hit')), 12, 4, [FLOWERS[i].c, '#f2c35b', '#eb9ab2']);
        $('#reasonN').textContent = t('gift.of', { n: opened, t: FLOWERS.length }); $('#reasonT').textContent = CONFIG.flores[i] || '';
        replay($('#reason'), 'place .6s cubic-bezier(.2,1.1,.3,1) both');
        if (opened >= FLOWERS.length){ setTimeout(celebrate, 900); reveal($('#nextGift'), 1600); }
      };
      const hit = g.querySelector('.flower-hit');
      hit.addEventListener('click', open);
      hit.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); } });
    });
  }
  starts['p-gift'] = () => {
    opened = 0; $('#gift').hidden = false; $('#gift').classList.remove('open'); $('#giftTap').hidden = false;
    $('#garden').hidden = true; $('#garden').classList.remove('rise'); $('#reason').hidden = true; $('#nextGift').hidden = true;
    $('#reasonN').textContent = t('gift.intro'); $('#reasonT').textContent = t('gift.introText');
    const say = $('#giftSay'); say.dataset.say = t('gift.say'); writeSay($('#p-gift'));
    buildGarden();
  };
  $('#gift').addEventListener('click', e => {
    const g = e.currentTarget; if (g.classList.contains('open')) return;
    g.classList.add('open'); $('#giftTap').hidden = true;
    burst(...center(g), 26, 6);
    setTimeout(() => {
      g.hidden = true; $('#garden').hidden = false; $('#garden').classList.add('rise'); $('#reason').hidden = false;
      $('#giftSay').dataset.say = t('gift.say2'); writeSay($('#p-gift'));
    }, reduce ? 0 : 950);
  });

  /* ---------- 5 · tarta ---------- */
  (function drawTart(){
    let h = '';
    h += `<ellipse cx="160" cy="282" rx="128" ry="12" fill="${INK}" opacity=".12"/>`;
    h += `<path d="M44 176 L60 276 Q160 292 260 276 L276 176 Z" fill="url(#crust)" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`;
    for (let i=0;i<10;i++){ const x = 58 + i*21; h += `<path d="M${x} 186 Q ${x+2} 232 ${x+3} 272" stroke="#c78f45" stroke-width="3" fill="none" opacity=".7"/><path d="M${x+8} 188 Q ${x+10} 232 ${x+11} 270" stroke="#fff3cf" stroke-width="3" fill="none" opacity=".8"/>`; }
    h += `<path d="M40 176 Q 60 166 80 176 T 120 176 T 160 176 T 200 176 T 240 176 T 280 176" stroke="${INK}" stroke-width="3" fill="#f3cf8a"/>`;
    h += `<path d="M52 176 Q 160 150 268 176 Q 160 190 52 176 Z" fill="#fffaf0" stroke="${INK}" stroke-width="2"/>`;
    const berry = (x, y, s, r) => `<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><path d="M0 -34 C 22 -34, 30 -10, 18 12 C 10 26, 4 32, 0 34 C -4 32, -10 26, -18 12 C -30 -10, -22 -34, 0 -34 Z" fill="#d64550" stroke="${INK}" stroke-width="2.5"/><path d="M-8 -26 C -16 -18, -18 -4, -12 6" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/>${[[-8,-8],[6,-14],[10,2],[-4,10],[2,20],[-12,4],[12,-24]].map(([a,b]) => `<ellipse cx="${a}" cy="${b}" rx="1.4" ry="2" fill="#5a1a1f"/>`).join('')}</g>`;
    [[92,148,.9,-8],[132,138,.95,6],[176,136,.95,-4],[222,146,.9,10]].forEach(b => h += berry(...b));
    [[74,168,1,-14],[114,162,1.1,4],[160,160,1.15,-2],[206,162,1.1,8],[246,170,1,16]].forEach(b => h += berry(...b));
    [[70,178],[132,182],[196,182],[252,180]].forEach(([x,y]) => h += `<path d="M${x} ${y} q4 10 0 18 q-4 -8 0 -18 z" fill="#c23e55" stroke="${INK}" stroke-width="1.5" opacity=".9"/>`);
    $('#tart').innerHTML = h;
  })();
  let blown = 0, canBlow = false;
  function blow(c){ if (!canBlow || c.classList.contains('out')) return; c.classList.add('out'); blown++; if (blown >= 2) blownAll(); }
  function blownAll(){
    canBlow = false; $('#tartbox').classList.remove('wish'); $('#blowBtn').hidden = true;
    setTimeout(() => { document.body.classList.remove('night'); setTimeout(paintChecks, 1300); setText($('#cakeSub'), t('cake.done')); celebrate(); }, reduce ? 0 : 700);
    reveal($('#nextCake'), 1900);
  }
  function gusts(){
    const box = $('#tartbox');
    for (let i=0;i<7;i++) setTimeout(() => { const g = document.createElement('span'); g.className = 'gust'; g.style.top = (6 + Math.random()*20) + '%'; g.style.left = '0'; g.style.width = (60 + Math.random()*80) + 'px'; box.appendChild(g); setTimeout(() => g.remove(), 800); }, i*70);
  }
  starts['p-cake'] = () => {
    blown = 0; canBlow = false; $$('.candle').forEach(c => c.classList.remove('out'));
    $('#tartbox').classList.remove('wish', 'wind'); $('#wishBtn').hidden = false; $('#blowBtn').hidden = true; $('#nextCake').hidden = true;
    setText($('#cakeSub'), t('cake.sub'));
  };
  $('#wishBtn').addEventListener('click', () => {
    $('#wishBtn').hidden = true; $('#tartbox').classList.add('wish'); document.body.classList.add('night'); setTimeout(paintChecks, 1300);
    setText($('#cakeSub'), t('cake.blowHint'));
    canBlow = true; reveal($('#blowBtn'), 900);
  });
  $('#blowBtn').addEventListener('click', () => { if (!canBlow) return; $('#tartbox').classList.add('wind'); gusts(); $$('.candle').forEach((c, i) => setTimeout(() => blow(c), 450 + i*240)); });
  $$('.candle').forEach(c => c.querySelector('.flame-hit').addEventListener('click', () => blow(c)));
  $('#tartbox').addEventListener('pointermove', e => { const el = document.elementFromPoint(e.clientX, e.clientY); if (el && el.classList.contains('flame-hit')) blow(el.closest('.candle')); });

  /* ---------- 6 · carta ---------- */
  let revealT = null, revealDelay = null;
  starts['p-letter'] = () => {
    $('#lDate').textContent = CONFIG.fecha; $('#lGreet').textContent = CONFIG.saludo;
    const sign = $('#lSign'); setText(sign, CONFIG.firma); sign.className = 'sign c';
    $('#nextLetter').hidden = true; $('#letterTap').hidden = false;
    const ms = new Date(CONFIG.reencuentro).getTime() - Date.now(), hrs = Math.round(ms/3600000);
    const cuando = ms <= 0 ? t('letter.today') : hrs < 1 ? t('letter.minutes') : hrs === 1 ? t('letter.hour') : t('letter.hours', { n: hrs });
    const body = $('#lBody'); body.innerHTML = '';
    const frag = document.createDocumentFragment(), spans = [];
    for (const ch of CONFIG.carta.replace('{cuando}', cuando)){ const s = document.createElement('span'); s.className = 'c'; s.textContent = ch; frag.appendChild(s); spans.push(s); }
    body.appendChild(frag);
    let i = 0; clearInterval(revealT); clearTimeout(revealDelay);
    let done = false;
    const finish = () => { if (done) return; done = true; clearTimeout(revealDelay); clearInterval(revealT); spans.forEach(s => s.classList.add('on')); sign.classList.add('on'); $('#letterTap').hidden = true; reveal($('#nextLetter'), 700); };
    $('#letter').onclick = finish;
    if (reduce){ finish(); return; }
    revealDelay = setTimeout(() => { revealT = setInterval(() => { for (let k=0;k<2 && i<spans.length;k++) spans[i++].classList.add('on'); if (i >= spans.length) finish(); }, 42); }, 900);
    leaveHooks.push(() => { clearTimeout(revealDelay); clearInterval(revealT); });
  };

  /* ---------- 7 · abrazo ---------- */
  let cdT = null, hugTimers = [];
  starts['p-hug'] = () => {
    hugTimers.forEach(clearTimeout); hugTimers = [];
    const fig = $('#fig'), heart = $('#bigheart'), say = $('#hugSay');
    fig.classList.remove('open', 'squeeze', 'given'); heart.classList.remove('fly'); $('#after').hidden = true; $('#count').hidden = false;
    say.dataset.say = ''; say.textContent = '';
    const T = (ms, f) => hugTimers.push(setTimeout(f, reduce ? 0 : ms));
    T(700, () => fig.classList.add('open'));
    T(1500, () => { say.dataset.say = t('hug.say'); writeSay($('#p-hug')); });
    T(2600, () => { fig.classList.remove('open'); fig.classList.add('squeeze'); });
    T(3300, () => { heart.classList.add('fly'); burst(...center(fig), 26, 6, ['#d64550', '#eb9ab2', '#f2c35b']); });
    T(4600, () => {
      $('#reunionText').textContent = CONFIG.reencuentroTexto; $('#reunionWhen').textContent = CONFIG.reencuentroCuando; $('#after').hidden = false;
      const target = new Date(CONFIG.reencuentro).getTime();
      const upd = () => {
        const ms = target - Date.now();
        if (ms <= 0){ clearInterval(cdT); $('#count').hidden = true; $('#reunionText').textContent = t('hug.today'); return; }
        $('#cd-d').textContent = Math.floor(ms/86400000);
        $('#cd-h').textContent = String(Math.floor(ms%86400000/3600000)).padStart(2, '0');
        $('#cd-m').textContent = String(Math.floor(ms%3600000/60000)).padStart(2, '0');
        $('#cd-s').textContent = String(Math.floor(ms%60000/1000)).padStart(2, '0');
      };
      upd(); clearInterval(cdT); cdT = setInterval(upd, 1000);
    });
    T(6200, () => { fig.classList.remove('squeeze'); fig.classList.add('given'); });
    leaveHooks.push(() => { hugTimers.forEach(clearTimeout); clearInterval(cdT); });
  };
  $('#replay').addEventListener('click', () => show('p-photo'));
})();
</script>
</body>
</html>
